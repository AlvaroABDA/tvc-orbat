<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVC ORBAT - Acceso</title>
    <!-- Use main app's fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --theme-color: #c0c0c0;
            --font-main: 'Rajdhani', sans-serif;
            --font-mono: 'Orbitron', monospace;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(22, 27, 34, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(22, 27, 34, 0.8) 1px, transparent 1px);
            background-size: 30px 30px;
            margin: 0;
            font-family: var(--font-main);
            overflow: hidden;
            color: var(--text-color);
        }

        .login-box {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid var(--theme-color);
            padding: 3rem;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.1), inset 0 0 10px rgba(192, 192, 192, 0.05);
            backdrop-filter: blur(5px);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 20;
            overflow: hidden; /* For the scanner */
        }
        
        /* Efecto de escaneo (Barrita guay) */
        .login-box::after {
            content: '';
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to bottom, transparent, var(--theme-color));
            opacity: 0.2;
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: -50px; }
            100% { top: 100%; }
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            color: #fff;
            margin-top: 0;
            margin-bottom: 0.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        input[type="text"], input[type="password"] {
            width: calc(100% - 2rem);
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border-radius: 2px;
            transition: border-color 0.3s, box-shadow 0.3s;
            text-transform: uppercase;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--theme-color);
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.2);
        }
        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: #444;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: var(--font-mono);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: transparent;
            color: var(--theme-color);
            border: 1px solid var(--theme-color);
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(192, 192, 192, 0.1);
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.2);
        }
        .error-msg {
            color: #ff4d4d;
            margin-top: 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>TVC ACCESO</h1>
        <div class="subtitle">SISTEMA DE GESTIÓN TÁCTICA</div>
        
        <form action="/login" method="POST">
            <input type="text" name="usuario" placeholder="USUARIO" autocomplete="off" required>
            <input type="password" name="password" placeholder="CONTRASEÑA" required>
            
            <label style="display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 1.5rem; color: #aaa; font-family: var(--font-main); font-size: 0.9rem; cursor: pointer;">
                <input type="checkbox" name="remember_me" value="yes" style="width: auto; padding: 0; margin: 0; accent-color: var(--theme-color); cursor: pointer;">
                Mantener sesión iniciada
            </label>

            <button type="submit" class="btn">
                <span class="material-symbols-outlined">login</span> CONECTAR
            </button>
        </form>

        {% if error %}
            <div class="error-msg">> ACCESO DENEGADO</div>
        {% endif %}
    </div>
</body>
</html>
