<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVC ORBAT - Acceso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #050505;
            background-image: 
                radial-gradient(circle at center, #111 0%, #000 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.4) 2px, rgba(0, 0, 0, 0.4) 4px);
            margin: 0;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
        }
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
        .login-box {
            background: rgba(10, 15, 20, 0.85);
            border: 1px solid rgba(0, 255, 170, 0.5);
            padding: 3rem;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.1), inset 0 0 20px rgba(0, 255, 170, 0.05);
            backdrop-filter: blur(5px);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 20;
        }
        .login-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: #00ffaa;
            box-shadow: 0 0 15px #00ffaa;
        }
        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            color: #00ffaa;
            margin-top: 0;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }
        .subtitle {
            color: #777;
            margin-bottom: 2rem;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #00ffaa;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border-radius: 2px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }
        input[type="password"]::placeholder {
            color: #444;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: transparent;
            color: #00ffaa;
            border: 1px solid #00ffaa;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(0, 255, 170, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
            text-shadow: 0 0 5px #00ffaa;
        }
        .error-msg {
            color: #ff3333;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="login-box">
        <h1>TVC TERMINAL</h1>
        <div class="subtitle">SISTEMA DE MANDO Y CONTROL</div>
        
        <form action="/login" method="POST">
            <input type="password" name="codigo" placeholder="INTRODUZCA CÓDIGO" required autofocus autocomplete="off">
            <button type="submit" class="btn">
                <span style="font-size: 1.4rem;">&#x23FB;</span> CONECTAR
            </button>
        </form>

        {% if error %}
            <div class="error-msg">> ERROR: {{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
